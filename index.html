<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSE</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; color: #1f2937; font-family: "Microsoft YaHei", Arial, sans-serif; }
    header { height: 64px; display: flex; align-items: center; padding: 0 40px; background: #ffffff; border-bottom: 1px solid #e5e7eb; color: #1677ff; font-size: 20px; font-weight: 700; }
    main { max-width: 1080px; margin: 0 auto; padding: 40px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 28px; color: #64748b; }
    section { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 6px; }
    h2 { margin: 0; padding: 18px 22px; border-bottom: 1px solid #e5e7eb; font-size: 16px; }
    a { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; color: #1f2937; text-decoration: none; }
    a:hover { background: #f0f7ff; }
    .name { font-weight: 600; }
    .path { color: #1677ff; font-size: 13px; }
  </style>
</head>
<body>
  <header>HSE</header>
  <main>
    <h1>模块原型</h1>
    <p>按 HSE 业务模块访问对应页面原型。</p>
    <section>
      <h2>双预防</h2>
      <a href="./双预防/政府专项检查/">
        <span class="name">政府专项检查</span>
        <span class="path">打开原型</span>
      </a>
    </section>
  </main>
</body>
</html>
